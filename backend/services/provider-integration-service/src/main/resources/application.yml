# Base configuration shared by every profile. Environment-specific values (datasource, Redis,
# Kafka brokers, CORS origins, FlixBus credentials) are deliberately absent here — they belong in
# application-<profile>.yml so a missing profile activation fails loudly instead of silently
# falling back to a guessed default. See README.md "Configuration Profiles".

spring:
  application:
    name: provider-integration-service

  jackson:
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway is the sole source of schema truth — Hibernate never auto-migrates.
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: provider-integration-service
    description: RoadScanner Provider Integration Service — the platform's sole gateway to external transportation providers

# Operational tuning knobs (docs/services/provider-integration-service/). Values here are the
# platform baseline, overridable per environment.
roadscanner:
  security:
    credential-encryption:
      # Base64-encoded AES key (16/24/32 bytes) from the secrets manager. No default: a shipped
      # default key would encrypt every deployment's secrets with a value readable from source.
      key: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:}
      ephemeral-key: ${PROVIDER_CREDENTIAL_EPHEMERAL_KEY:false}
    jwt:
      # Must match auth-service's own issuer claim exactly
      # (docs/services/auth-service/security-design.md).
      issuer: roadscanner-auth-service
  provider:
    execution:
      # Backoff shape and pool size are platform-wide; per-provider timeout_ms and retry_count
      # live on the provider_configurations row and are changed through the admin API.
      backoff-initial: PT0.2S
      backoff-multiplier: 2.0
      # Caps any single delay — a provider configured with 5 retries must not hold a request
      # thread for minutes.
      backoff-max: PT2S
      # Full jitter, so a recovering provider is not hit by synchronised retry waves.
      backoff-jitter: true
      # Bounded: a timed-out call keeps its worker until its socket timeout fires.
      pool-size: 32
      shutdown-grace: PT5S
    health-check-interval: PT30S
    session-expiry-sweep-interval: PT60S
    capabilities-cache-ttl: PT1H
    seat-map-cache-ttl: PT30S
    kafka:
      audit-topic: provider-integration-events
    flixbus:
      connect-timeout: PT2S
      read-timeout: PT5S

# Resilience4j — one instance ("flixbus") shared by every FlixBus*Client method. Only
# ProviderUnavailableException counts toward the circuit breaker's failure rate / is retried
# (see FlixBusExceptionTranslator's Javadoc) — a seat-unavailable or booking-declined response is
# a valid business outcome, not a provider-health signal, and must never trip the breaker.
resilience4j:
  circuitbreaker:
    instances:
      flixbus:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: PT30S
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.roadscanner.providerintegrationservice.domain.exception.ProviderUnavailableException
  # Retry deliberately removed in Sprint 2.1. It now lives in the shared execution layer, which
  # reads attempts from each provider's own retry_count column instead of one static instance —
  # leaving this here as well would compound the two (3 x 3 = 9 attempts against a struggling
  # provider). Circuit breaking, rate limiting and bulkheading stay: they are per-provider
  # protections, not per-call ones, and do not overlap with the execution policy.
  ratelimiter:
    instances:
      flixbus:
        limit-for-period: 50
        limit-refresh-period: PT1S
        timeout-duration: PT0.5S
  bulkhead:
    instances:
      flixbus:
        max-concurrent-calls: 25
        max-wait-duration: PT0.5S
