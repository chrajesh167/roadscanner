# Local development profile — targets the docker-compose Postgres/Redis/Kafka (docker-compose.yml
# at the repo root). Activate with SPRING_PROFILES_ACTIVE=local.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/providerintegrationservice
    username: providerintegrationservice
    password: providerintegrationservice
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

roadscanner:
  security:
    credential-encryption:
      # Local development only: a throwaway key generated at startup. Credentials written now
      # cannot be read after a restart — same trade-off as the ephemeral JWT keys below.
      ephemeral-key: true
    jwt:
      # ---------------------------------------------------------------------------------------
      # auth-service's SHARED DEVELOPMENT public key. NOT A SECRET, and the private half is not
      # here — this service only ever verifies.
      #
      # Byte-identical to the public half in auth-service's own application-local.yml, which is
      # what makes one locally-issued token work across the whole stack. It replaces
      # `ephemeral-keys: true`, which generated a throwaway pair per process: login succeeded at
      # auth-service and every call here 401'd, because the two never shared key material.
      #
      # The flag is deliberately absent rather than set to false — JwtConfig checks it *before*
      # the configured key, so leaving it on would silently win and this key would be ignored.
      #
      # Deployed environments never load this file. There, `public-key-pem` comes from the
      # secrets manager, and a missing key still fails startup loudly — see config/JwtConfig.
      public-key-pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAu8GV0iNS6+j6v457XNVO
        8bZGbHGyZiM1kP2UKGvARMNensJhn6onErFC/rN9Odqtp3IAV2L/LgPy4MEXe1zW
        NZYFNr9roDTwkje9H+mq+jOnBDXEbnYkMRYdH1EA9OyQcTUEKP5nv8MIreChpQpR
        1SNVUrBtzHI4pN5QyyHUvUYsefj1c9qjzN8AhKS2fI6PSEH1g0YUlnV40NjvFzt3
        phLXR/mgUkTiyy4FrFyW3Wb165nXB1UQTpnUHyXJUc0wsiPLhCx62M5KMZRxHnfn
        C5sXoPARKQu8xlc5E+mDQ4nNm2jjPsAmXGykyr9b8yWlLDnZMW3GST9EnIjFFZ33
        nQIDAQAB
        -----END PUBLIC KEY-----
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  provider:
    flixbus:
      # Placeholder — RoadScanner has no real FlixBus B2B base URL or credentials yet (see
      # README.md "Remaining Integration Points"). The FLIXBUS provider row is seeded
      # enabled=false, so nothing calls this URL until it's replaced with a real one.
      base-url: https://flixbus.example.invalid

logging:
  level:
    com.roadscanner.providerintegrationservice: DEBUG
    org.hibernate.SQL: DEBUG
