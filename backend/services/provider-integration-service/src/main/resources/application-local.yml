# Local development profile — targets the docker-compose Postgres/Redis/Kafka (docker-compose.yml
# at the repo root). Activate with SPRING_PROFILES_ACTIVE=local.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/providerintegrationservice
    username: providerintegrationservice
    password: providerintegrationservice
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

roadscanner:
  security:
    credential-encryption:
      # A stable local key, supplied by the environment — NOT a throwaway one.
      #
      # This used to be `ephemeral-key: true`, which generated a fresh key every startup. Because
      # the cipher is what protects `provider_credentials`, that meant a partner token stored
      # through the admin console decrypted fine until the next restart and then never again — the
      # row survived, the key did not. Anyone entering real FlixBus credentials locally lost them
      # on the next `mvn spring-boot:run` and had no way to tell why.
      #
      # `ephemeral-key` is deliberately NOT set here rather than set to false: CredentialEncryption-
      # Config treats a missing key with no explicit opt-out as a startup failure, and that is the
      # behaviour we want locally. An unset PROVIDER_CREDENTIAL_ENCRYPTION_KEY now stops the service
      # with an actionable message instead of silently minting a key that discards tomorrow's data.
      #
      # Generate one once and export it — see backend/services/provider-integration-service/README.md.
      # Never commit the value; this file carries the reference, never the key.
      key: ${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:}
    jwt:
      # ---------------------------------------------------------------------------------------
      # auth-service's SHARED DEVELOPMENT public key. NOT A SECRET, and the private half is not
      # here — this service only ever verifies.
      #
      # Byte-identical to the public half in auth-service's own application-local.yml, which is
      # what makes one locally-issued token work across the whole stack. It replaces
      # `ephemeral-keys: true`, which generated a throwaway pair per process: login succeeded at
      # auth-service and every call here 401'd, because the two never shared key material.
      #
      # The flag is deliberately absent rather than set to false — JwtConfig checks it *before*
      # the configured key, so leaving it on would silently win and this key would be ignored.
      #
      # Deployed environments never load this file. There, `public-key-pem` comes from the
      # secrets manager, and a missing key still fails startup loudly — see config/JwtConfig.
      public-key-pem: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAu8GV0iNS6+j6v457XNVO
        8bZGbHGyZiM1kP2UKGvARMNensJhn6onErFC/rN9Odqtp3IAV2L/LgPy4MEXe1zW
        NZYFNr9roDTwkje9H+mq+jOnBDXEbnYkMRYdH1EA9OyQcTUEKP5nv8MIreChpQpR
        1SNVUrBtzHI4pN5QyyHUvUYsefj1c9qjzN8AhKS2fI6PSEH1g0YUlnV40NjvFzt3
        phLXR/mgUkTiyy4FrFyW3Wb165nXB1UQTpnUHyXJUc0wsiPLhCx62M5KMZRxHnfn
        C5sXoPARKQu8xlc5E+mDQ4nNm2jjPsAmXGykyr9b8yWlLDnZMW3GST9EnIjFFZ33
        nQIDAQAB
        -----END PUBLIC KEY-----
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  provider:
    flixbus:
      # The real B2B host, matching what V8 already wrote to provider_configurations.base_url.
      #
      # This was `https://flixbus.example.invalid` — correct while the FLIXBUS row was seeded
      # enabled=false and nothing called it. Once the row was enabled and credentials stored, every
      # federated search resolved that deliberately-unresolvable domain and failed DNS before a
      # request left the machine, which surfaced as an empty result rather than a configuration
      # error: the adapter reads its base URL from here, never from the database column, so
      # correcting the row in V8 had no effect on the HTTP client.
      #
      # Overridable so a sandbox host can be pointed at without editing this file, matching the
      # dev profile's ${FLIXBUS_BASE_URL} convention.
      base-url: ${FLIXBUS_BASE_URL:https://global.api.flixbus.com}

logging:
  level:
    com.roadscanner.providerintegrationservice: DEBUG
    org.hibernate.SQL: DEBUG
