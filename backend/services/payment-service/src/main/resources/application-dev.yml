# Deployed dev environment profile. Every environment-specific value comes from an env var with no
# hardcoded fallback for secrets — a missing env var should fail startup loudly, not silently
# default to something insecure.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

management:
  endpoint:
    health:
      show-details: never

roadscanner:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      public-key-pem: ${AUTH_SERVICE_JWT_PUBLIC_KEY_PEM}
  payment:
    gateways:
      default-type: ${PAYMENT_DEFAULT_GATEWAY:RAZORPAY}
      webhook-secrets:
        RAZORPAY: ${RAZORPAY_WEBHOOK_SECRET}
        STRIPE: ${STRIPE_WEBHOOK_SECRET}
        ADYEN: ${ADYEN_WEBHOOK_SECRET}

logging:
  level:
    com.roadscanner.paymentservice: INFO
