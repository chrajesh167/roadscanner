# Local development profile — targets the docker-compose Postgres/Kafka (docker-compose.yml at the
# repo root). Activate with SPRING_PROFILES_ACTIVE=local. The app runs natively
# (./mvnw spring-boot:run) against those containers.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5437/paymentservice
    username: paymentservice
    password: paymentservice
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

roadscanner:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  security:
    jwt:
      # Local development only: throwaway verification key generated at startup. Never set in a
      # deployed environment.
      ephemeral-keys: true
  payment:
    gateways:
      default-type: RAZORPAY
      # Local stub webhook signing secrets (HMAC-SHA256). Never real secrets.
      webhook-secrets:
        RAZORPAY: local-razorpay-secret
        STRIPE: local-stripe-secret
        ADYEN: local-adyen-secret

logging:
  level:
    com.roadscanner.paymentservice: DEBUG
    org.hibernate.SQL: DEBUG
