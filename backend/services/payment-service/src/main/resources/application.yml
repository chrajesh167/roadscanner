# Base configuration shared by every profile. Environment-specific values (datasource, Kafka
# brokers, CORS origins, JWT public key, gateway webhook secrets) are deliberately absent here —
# they belong in application-<profile>.yml so a missing profile activation fails loudly instead of
# silently falling back to a guessed default.

spring:
  application:
    name: payment-service

  jackson:
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway is the sole source of schema truth — Hibernate never auto-migrates.
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Deserializers are configured programmatically per topic in config.KafkaConfig.
  kafka:
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

server:
  port: 8086
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: payment-service
    description: RoadScanner Payment Service — the platform's payment lifecycle owner

roadscanner:
  security:
    jwt:
      # Must match auth-service's own issuer claim exactly (docs/services/auth-service/security-design.md).
      issuer: roadscanner-auth-service
  payment:
    # Acceptable window for a gateway outcome before Sweep Expired Payments marks a payment EXPIRED.
    # Must be shorter than the seat-hold TTL provider-integration-service grants, so a booking's hold
    # outlives payment processing (docs/architecture/seat-locking-flow.md).
    payment-window: PT10M
    kafka:
      # Business outcomes booking-service consumes (COMPLETED/FAILED/TIMED_OUT).
      payment-events-topic: payment-events
      # Informational (PaymentCreated) + refund events booking-service does NOT consume.
      payment-lifecycle-events-topic: payment-lifecycle-events
      # Consumed for BookingCancelled reconciliation.
      booking-events-topic: booking-events
    scheduling:
      sweep-expired-payments-cron: "0 */2 * * * *"
    gateways:
      default-type: RAZORPAY
