# Local development profile — targets the docker-compose Postgres/Redis/Kafka (docker-compose.yml
# at the repo root). Activate with SPRING_PROFILES_ACTIVE=local.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/searchservice
    username: searchservice
    password: searchservice
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

roadscanner:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  security:
    jwt:
      # Local development only: a throwaway verification key generated at startup. Tokens minted
      # by a separately-running auth-service will NOT be accepted — the two processes do not
      # share key material. Never set this in a deployed environment.
      ephemeral-keys: true
  inventory-service:
    # inventory-service runs on 8084 — 8083 is provider-integration-service. Pointing here at
    # 8083 makes every availability lookup 404, which "degrade, not fail" then hides as a
    # permanent availabilityKnown=false rather than as an error.
    base-url: http://localhost:8084

logging:
  level:
    com.roadscanner.searchservice: DEBUG
    org.hibernate.SQL: DEBUG
