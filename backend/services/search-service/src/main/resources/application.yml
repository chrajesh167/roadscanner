# Base configuration shared by every profile. Environment-specific values (datasource, Redis,
# Kafka brokers, CORS origins) are deliberately absent here — they belong in
# application-<profile>.yml so a missing profile activation fails loudly instead of silently
# falling back to a guessed default. See README.md "Configuration Profiles".

spring:
  application:
    name: search-service

  jackson:
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway is the sole source of schema truth — Hibernate never auto-migrates.
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Deserializers are configured programmatically per topic in config.KafkaConfig (each topic's
  # JSON target type is bound explicitly in code, not resolved via producer-sent type headers —
  # see that class's Javadoc for why), so only the generic connection/group properties belong
  # here; bootstrap-servers comes from the active profile (application-local.yml/-dev.yml).
  kafka:
    consumer:
      group-id: search-service
      auto-offset-reset: earliest

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: search-service
    description: RoadScanner Search Service — trip search, ranking, and filtering over a derived read model

# Operational tuning knobs (docs/services/search-service/boundaries.md, use-cases.md). Values
# here are the platform baseline, overridable per environment.
roadscanner:
  google-places:
    # Off unless a key is supplied. GOOGLE_PLACES_API_KEY is read server-side only and is never
    # returned by any endpoint — the browser calls this service, this service calls Google.
    enabled: ${GOOGLE_PLACES_ENABLED:false}
    api-key: ${GOOGLE_PLACES_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api
    # Autocomplete is on the interactive path; a slow provider must not hold a request thread.
    request-timeout: PT2S
    # Longer than the availability cache (PT15S): place names are effectively static, so the
    # trade-off here is cost against staleness that barely exists.
    cache-ttl: PT10M
    cache-max-size: 5000
    language: en
    region: IN
  security:
    jwt:
      # Must match auth-service's own issuer claim exactly (docs/services/auth-service/security-design.md).
      # The verification key itself is environment-specific: a real public-key-pem in deployed
      # environments, ephemeral-keys in local/test — see config.JwtConfig, which refuses to start
      # if neither is supplied.
      issuer: roadscanner-auth-service
  search:
    pagination:
      default-page-size: 20
      max-page-size: 50
    suggestions:
      max-results: 10
    availability:
      cache-ttl: PT15S # short-lived by design — docs/services/search-service/boundaries.md
      request-timeout: PT0.5S
    kafka:
      # inventory-service's OWN catalog events (TripPublished/Updated/Cancelled), which is what
      # this service indexes per docs/architecture/api-inventory.md. `trip-events` is the
      # operator-service -> inventory-service topic and carries the upstream feed, not the
      # reconciled catalog — subscribing to it left the index empty.
      trip-events-topic: catalog-trip-events
      review-events-topic: review-events
