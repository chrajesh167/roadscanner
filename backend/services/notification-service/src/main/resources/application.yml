# Base configuration shared by every profile. Environment-specific values (datasource, Kafka
# brokers, SMTP host and credentials) are deliberately absent here — they belong in
# application-<profile>.yml so a missing profile activation fails loudly instead of silently
# falling back to a guessed default.

spring:
  application:
    name: notification-service

  jackson:
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # Flyway is the sole source of schema truth — Hibernate never auto-migrates.
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Deserializers are configured programmatically per topic in config.KafkaConfig.
  kafka:
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

server:
  port: 8087
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
  health:
    # This service's readiness does not depend on a mail server, and must not.
    #
    # Spring Boot's mail indicator opens an SMTP connection on every probe, so with no host
    # configured — the normal local state — it reports the whole service DOWN. An orchestrator
    # reading that would keep restarting a service that is consuming events correctly and recording
    # honest failures. It would also make an outage at the mail provider look like an outage here,
    # and put an SMTP handshake on the liveness path of a consumer that is otherwise self-contained.
    #
    # Delivery health is observable where it belongs: FAILED rows in notification_log, with reasons.
    mail:
      enabled: false

roadscanner:
  notification:
    kafka:
      booking-events-topic: booking-events
