# Local development profile — targets the docker-compose Postgres/Redis (docker-compose.yml at
# the repo root). Activate with SPRING_PROFILES_ACTIVE=local (already set for the auth-service
# container in docker-compose.yml; set it yourself when running the jar directly).

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/authservice
    username: authservice
    password: authservice
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

roadscanner:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174
  security:
    jwt:
      # ---------------------------------------------------------------------------------------
      # THE SHARED DEVELOPMENT KEY PAIR. NOT A SECRET. NEVER USE IT ANYWHERE REAL.
      #
      # This pair is checked into the repository on purpose. Every verifying service's own
      # application-local.yml carries the public half verbatim, so one token minted here is
      # accepted by search-service, provider-integration-service, booking-service and
      # payment-service — which is what makes a locally-running stack usable from the UIs at all.
      #
      # It replaces `ephemeral-keys: true`, which generated a *different* throwaway pair in every
      # process: login succeeded and every subsequent call 401'd, because five services each
      # trusted a key only they had. Note the flag is not merely unset but absent — each
      # verifier's JwtConfig checks it before the configured key, so leaving it on would silently
      # win and the fix would do nothing.
      #
      # Deployed environments never see this file (it also points every datasource at localhost).
      # There, `private-key-pem` and `public-key-pem` come from the secrets manager exactly as
      # they do today, and a missing key still fails startup loudly — see config/JwtConfig.
