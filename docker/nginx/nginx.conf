# RoadScanner production ingress.
#
# This is the only container that publishes a port. Every service port (8081-8087) and both Next.js
# servers (3000) stay on the internal Docker network, reachable only through the routes below.
#
# Single public origin, path-routed. That is not cosmetic: the browser calls six different services
# today, and one origin collapses six CORS allow-lists and six internet-facing ports into one of
# each. The paths below are the services' real @RequestMapping values — nothing is invented, and
# nothing needed changing in any controller.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # Ticket PDFs and booking payloads are small; this is a ceiling, not a target.
    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Docker's embedded DNS, resolved per request rather than once at startup.
    #
    # With a literal `proxy_pass http://auth-service:8081`, nginx resolves every upstream while
    # loading the config and refuses to start if any one of them is not yet running — so a single
    # slow service would keep the whole ingress down. Resolving through a variable defers that to
    # request time: nginx starts regardless, and a service that is down returns 502 for its own
    # routes while every other route keeps serving.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shared proxy behaviour. Authorization is deliberately never touched — nginx forwards client
    # headers as-is, and every backend authenticates the JWT itself.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Request bodies are buffered and forwarded whole. payment-service verifies an HMAC over the
    # raw webhook body, so the body must arrive byte-identical — no rewriting, no chunk mangling.
    proxy_request_buffering on;

    server {
        listen 80;
        server_name _;

        # ---------------------------------------------------------------- health

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # ---------------------------------------------------------------- internal surface

        # /internal/** is INTENTIONALLY NOT EXPOSED, and this is a decision rather than an omission.
        #
        # These are service-to-service routes that carry NO authentication in Phase 1 (disclosed in
        # each service's api-summary.md, which relies on the private network boundary instead).
        # Publishing them would hand the internet provider-integration-service's entire internal
        # surface unauthenticated: provider sessions, seat maps, orders, seat-block bookings and
        # ticket downloads. Blocking here is what makes that disclosed gap safe to deploy.
        #
        # Known and accepted consequence: admin-console's "probe now" button calls
        # /internal/api/v1/providers/{code}/health from the browser (src/features/health/api.ts) and
        # will therefore 404 in production. Accepted for this deployment phase. The proper fix is an
        # authenticated read endpoint on provider-integration-service, not an exception here — do
        # not add one to make the button work.
        location /internal/ {
            return 404;
        }

        # ---------------------------------------------------------------- backend APIs
        #
        # Prefix locations without a trailing slash, because several endpoints are addressed at the
        # prefix itself (POST /api/v1/bookings, GET /api/v1/payments). nginx picks the longest
        # matching prefix, which is what keeps /api/v1/provider-mappings (search-service) and
        # /api/v1/providers (provider-integration-service) apart.

        location /api/v1/auth {
            set $upstream_auth http://auth-service:8081;
            proxy_pass $upstream_auth$request_uri;
        }

        # search-service owns more than /api/v1/search: /api/v1/locations backs place autocomplete
        # in both apps, /api/v1/provider-mappings backs the admin console's mapping screens, and
        # /api/v1/google/places is the Places proxy. Routing only /api/v1/search would break all of
        # them — verified against the controllers, not assumed from the service name.
        location /api/v1/search {
            set $upstream_search http://search-service:8082;
            proxy_pass $upstream_search$request_uri;
        }

        location /api/v1/locations {
            set $upstream_search_loc http://search-service:8082;
            proxy_pass $upstream_search_loc$request_uri;
        }

        location /api/v1/provider-mappings {
            set $upstream_search_map http://search-service:8082;
            proxy_pass $upstream_search_map$request_uri;
        }

        location /api/v1/google/places {
            set $upstream_search_places http://search-service:8082;
            proxy_pass $upstream_search_places$request_uri;
        }

        location /api/v1/providers {
            set $upstream_provider http://provider-integration-service:8083;
            proxy_pass $upstream_provider$request_uri;
        }

        location /api/v1/inventory {
            set $upstream_inventory http://inventory-service:8084;
            proxy_pass $upstream_inventory$request_uri;
        }

        location /api/v1/bookings {
            set $upstream_booking http://booking-service:8085;
            proxy_pass $upstream_booking$request_uri;
        }

        location /api/v1/payments {
            set $upstream_payment http://payment-service:8086;
            proxy_pass $upstream_payment$request_uri;
        }

        # ---------------------------------------------------------------- gateway webhooks

        # Deliberately public and JWT-less: the payment gateway has no RoadScanner token.
        # WebhookController verifies an HMAC-SHA256 signature over the raw body instead, so this
        # route must reach payment-service unmodified rather than being protected here.
        location /webhooks {
            set $upstream_webhook http://payment-service:8086;
            proxy_pass $upstream_webhook$request_uri;
        }

        # ---------------------------------------------------------------- admin console

        # Served under /admin/, matching basePath: '/admin' in admin-console's next.config.ts. The
        # prefix is passed through untouched — no rewrite, no strip. Next owns the prefix, so it
        # also serves /admin/_next/* itself, which is what keeps the console's bundles from being
        # requested at the root and answered by customer-web.
        location /admin {
            set $upstream_admin http://admin-console:3000;
            proxy_pass $upstream_admin$request_uri;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------------------------------------------------------------- customer web

        # Catch-all last. Next.js serves its own /_next/* assets, so no separate static rule is
        # needed — the standalone server handles hashed bundles and their cache headers itself.
        location / {
            set $upstream_web http://customer-web:3000;
            proxy_pass $upstream_web$request_uri;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
